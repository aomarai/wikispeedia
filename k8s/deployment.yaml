apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikispeedia-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wikispeedia
  template:
    metadata:
      labels:
        app: wikispeedia
    spec:
      containers:
      - name: wikispeedia-backend
        image: your-docker-image
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: wikispeedia-config
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10